<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Service Status</title>
    <!-- Tailwind CSS for modern responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body
    class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4"
  >
    <div
      class="bg-slate-800/80 backdrop-blur border border-slate-700/50 shadow-2xl rounded-2xl p-8 max-w-md w-full flex flex-col items-center justify-center text-center space-y-4 transition-all duration-300 hover:border-slate-600"
    >
      <!-- Status Indicator Dot Container -->
      <div class="relative flex items-center justify-center">
        <!-- Outer Pulsing Glow -->
        <span
          class="absolute inline-flex h-10 w-10 rounded-full bg-emerald-400 opacity-25 animate-ping"
        ></span>

        <!-- Soft Outer Glow -->
        <span
          class="absolute inline-flex h-8 w-8 rounded-full bg-emerald-500/30 blur-sm"
        ></span>

        <!-- Inner Solid Green Dot -->
        <span
          class="relative inline-flex rounded-full h-5 w-5 bg-emerald-500 shadow-[0_0_12px_rgba(16,185,129,0.8)]"
        ></span>
      </div>

      <!-- Main Message -->
      <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white">
        Service is running
      </h1>

      <!-- Subtle Subtitle / Metadata -->
      <p
        class="text-xs sm:text-sm text-slate-400 font-medium tracking-wide uppercase"
      >
        All Systems Operational
      </p>
    </div>

    <div>
      <h2>Connect with an Agent Instantly</h2>
      <!-- Sends the phone number to your Node.js server route -->
      <form action="/click-to-call" method="POST">
        <label for="userNumber">Your Phone Number:</label>
        <input
          type="text"
          id="userNumber"
          name="userNumber"
          placeholder="+1111111111"
          required
        />
        <button type="submit">Call Me Now</button>
      </form>
    </div>
  </body>
</html>
